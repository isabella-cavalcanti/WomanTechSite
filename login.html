<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Woman Tech</title>
    <meta name="robots" content="noindex">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js" defer></script>
    <script src="js/login.js" defer></script>
</head>

<body data-page="login">
    <div id="header"></div>

    <main class="pt-32 pb-16 min-h-screen">
        <div class="container mx-auto px-4">
            <section class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-gradient-to-br from-[#682857] to-[#8d5e81] text-white p-8 text-center">
                    <img src="assets/icons/Variação_logo_elíptica_fundo_branco-removebg-preview.png" alt="" class="w-16 h-16 mx-auto mb-3 bg-white rounded-full p-1">
                    <h1 class="text-2xl font-bold">Área WomanTech</h1>
                    <p class="opacity-90 text-sm mt-1">Um só login para alunas, integrantes e coordenação</p>
                </div>

                <div id="abas" class="grid grid-cols-2 border-b border-gray-100" role="tablist">
                    <button role="tab" data-aba="entrar" class="aba py-4 font-bold text-[#682857] border-b-4 border-[#682857]">Entrar</button>
                    <button role="tab" data-aba="criar" class="aba py-4 font-bold text-gray-400 border-b-4 border-transparent">Criar conta</button>
                </div>

                <!-- Entrar -->
                <form id="form-entrar" class="p-8 space-y-4" novalidate>
                    <div><label for="e-email" class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                        <input id="e-email" type="email" required autocomplete="username" class="form-field" placeholder="seu@email.com"></div>
                    <div><label for="e-senha" class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                        <input id="e-senha" type="password" required autocomplete="current-password" class="form-field" placeholder="••••••••"></div>
                    <button type="submit" class="w-full bg-[#682857] text-white font-bold py-3 rounded-lg hover:bg-[#8d5e81] transition">Entrar</button>
                    <button type="button" id="btn-esqueci" class="w-full text-sm text-[#682857] font-bold hover:underline">Esqueci minha senha</button>
                    <p id="status-entrar" role="status" hidden></p>
                </form>

                <!-- Criar conta -->
                <form id="form-criar" class="hidden p-8 space-y-4" novalidate>
                    <p class="text-sm text-gray-600 bg-[#F5f5f5] rounded-lg p-3"><i class="fas fa-info-circle text-[#682857] mr-1"></i>
                        Toda conta nova começa como <b>aluna</b> (cursos e carreira). Integrantes do projeto recebem o acesso da coordenação depois.</p>
                    <div><label for="c-nome" class="block text-sm font-bold text-gray-700 mb-1">Nome *</label>
                        <input id="c-nome" type="text" required maxlength="80" autocomplete="name" class="form-field" placeholder="Seu nome"></div>
                    <div><label for="c-email" class="block text-sm font-bold text-gray-700 mb-1">E-mail *</label>
                        <input id="c-email" type="email" required autocomplete="email" class="form-field" placeholder="seu@email.com"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div><label for="c-senha" class="block text-sm font-bold text-gray-700 mb-1">Senha *</label>
                            <input id="c-senha" type="password" required minlength="8" autocomplete="new-password" class="form-field" placeholder="mín. 8 caracteres"></div>
                        <div><label for="c-senha2" class="block text-sm font-bold text-gray-700 mb-1">Repita a senha *</label>
                            <input id="c-senha2" type="password" required minlength="8" autocomplete="new-password" class="form-field"></div>
                    </div>
                    <label class="flex items-start gap-3 text-sm text-gray-700">
                        <input id="c-consentimento" type="checkbox" required class="mt-1 w-4 h-4 accent-[#682857]">
                        <span>Tenho 18 anos ou mais, <b>ou</b> tenho autorização do meu responsável para participar. Concordo que o WomanTech use meus dados apenas para as atividades do projeto.</span>
                    </label>
                    <button type="submit" class="w-full bg-[#682857] text-white font-bold py-3 rounded-lg hover:bg-[#8d5e81] transition">Criar conta</button>
                    <p id="status-criar" role="status" hidden></p>
                </form>

                <!-- Nova senha (link de recuperação) -->
                <form id="form-nova-senha" class="hidden p-8 space-y-4" novalidate>
                    <h2 class="text-xl font-bold text-[#682857]">Criar nova senha</h2>
                    <div><label for="n-senha" class="block text-sm font-bold text-gray-700 mb-1">Nova senha (mínimo 8 caracteres)</label>
                        <input id="n-senha" type="password" minlength="8" required autocomplete="new-password" class="form-field"></div>
                    <button type="submit" class="w-full bg-[#682857] text-white font-bold py-3 rounded-lg hover:bg-[#8d5e81] transition">Salvar senha</button>
                    <p id="status-nova" role="status" hidden></p>
                </form>
            </section>
        </div>
    </main>

    <div id="footer"></div>
</body>
</html>
