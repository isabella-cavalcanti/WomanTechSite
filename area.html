<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha área - Woman Tech</title>
    <meta name="robots" content="noindex">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js" defer></script>
    <script src="js/area.js" defer></script>
</head>

<body data-page="area">
    <div id="header"></div>

    <main class="pt-32 pb-16 min-h-screen">
        <div class="container mx-auto px-4">
            <div id="area-carregando" class="text-center text-gray-500 py-20"><i class="fas fa-spinner fa-spin mr-2"></i>Carregando…</div>

            <div id="area-conteudo" class="hidden">
                <div class="bg-gradient-to-br from-[#682857] to-[#8d5e81] rounded-2xl text-white p-8 md:p-10 mb-10 flex flex-col md:flex-row md:items-center gap-6">
                    <div id="avatar" class="w-20 h-20 rounded-full bg-white text-[#682857] flex items-center justify-center text-3xl font-bold shrink-0" style="font-family:'Raleway',sans-serif"></div>
                    <div class="flex-1">
                        <p class="opacity-80">Olá,</p>
                        <h1 id="ola-nome" class="text-3xl font-bold"></h1>
                        <div id="selos" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>
                    <div class="flex gap-3">
                        <button id="btn-editar-nome" class="border-2 border-white text-white font-bold px-5 py-2 rounded-full hover:bg-white hover:text-[#682857] transition"><i class="fas fa-pen mr-2"></i>Meu nome</button>
                        <button id="btn-sair" class="bg-white text-[#682857] font-bold px-5 py-2 rounded-full hover:bg-[#Ded9e2] transition"><i class="fas fa-sign-out-alt mr-2"></i>Sair</button>
                    </div>
                </div>

                <form id="form-nome" class="hidden bg-white rounded-2xl shadow p-6 mb-10 flex flex-col sm:flex-row gap-3 sm:items-end">
                    <div class="flex-1"><label for="novo-nome" class="block text-sm font-bold text-gray-700 mb-1">Como você quer ser chamada?</label>
                        <input id="novo-nome" required maxlength="80" class="form-field"></div>
                    <button type="submit" class="bg-[#682857] text-white font-bold px-6 py-3 rounded-lg hover:bg-[#8d5e81]">Salvar</button>
                </form>

                <div id="secoes"></div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
</body>
</html>
