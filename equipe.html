<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe - Woman Tech</title>
    <meta name="description" content="Coordenação, professoras, bolsistas e voluntárias do WomanTech.">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/dados-equipe.js"></script>
    <script src="js/script.js"></script>
</head>

<body data-page="equipe">
    <div id="header"></div>

    <main>
    <section class="relative overflow-hidden bg-gradient-to-br from-[#682857] to-[#8d5e81] pt-40 pb-32">
        <div class="blob bg-[#Ded9e2] w-72 h-72 -top-10 left-10 animate-pulse"></div>
        <div class="blob bg-[#8d5e81] w-64 h-64 bottom-0 right-20 animate-pulse" style="animation-delay: 2s;"></div>
        <div class="container mx-auto px-4 relative z-10 text-center text-white">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Nossa Equipe</h1>
            <p class="text-lg md:text-xl opacity-90 max-w-3xl mx-auto">Conheça as pessoas incríveis que fazem o WomanTech acontecer — a cada semestre, novas alunas se juntam ao projeto.</p>
        </div>
        <div class="hero-wave">
            <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C57.32,118.92,163.89,91.2,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
    </section>

    <section class="py-16">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-14">
                <div id="filtros-equipe" class="flex flex-wrap gap-3">
                    <button class="filter-btn active px-5 py-2 rounded-full font-bold text-sm" data-filtro="todos">Todas</button>
                    <button class="filter-btn px-5 py-2 rounded-full font-bold text-sm" data-filtro="coordenacao">Coordenação</button>
                    <button class="filter-btn px-5 py-2 rounded-full font-bold text-sm" data-filtro="professora">Professoras</button>
                    <button class="filter-btn px-5 py-2 rounded-full font-bold text-sm" data-filtro="aluna">Bolsistas e voluntárias</button>
                    <button class="filter-btn px-5 py-2 rounded-full font-bold text-sm" data-filtro="ex-integrante">Já passaram por aqui</button>
                </div>
                <label class="flex items-center gap-3 text-gray-600">
                    <i class="far fa-calendar text-[#682857]"></i>
                    <select id="filtro-semestre" class="form-field !w-auto !py-2" aria-label="Filtrar por semestre"></select>
                </label>
            </div>
            <div id="equipe-conteudo"></div>
        </div>
    </section>
    </main>

    <div id="footer"></div>
</body>
</html>
